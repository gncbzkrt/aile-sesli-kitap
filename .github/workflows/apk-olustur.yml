          package com.guncelgelisim.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.net.Uri;
          import android.media.AudioAttributes;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;

          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class TtsPlaybackService extends Service
                  implements TextToSpeech.OnInitListener {

              public static final String ACTION_PLAY_TEXT =
                      "com.guncelgelisim.PLAY_TEXT";
              public static final String ACTION_TOGGLE =
                      "com.guncelgelisim.TOGGLE";
              public static final String ACTION_STOP =
                      "com.guncelgelisim.STOP";
              public static final String ACTION_SKIP =
                      "com.guncelgelisim.SKIP";

              public static final String EXTRA_TITLE = "title";
              public static final String EXTRA_TEXT = "text";
              public static final String EXTRA_RATE = "rate";
              public static final String EXTRA_DELTA = "delta";

              private static final String CHANNEL = "gelisim_tts";
              private static final int NOTIFICATION_ID = 1515;

              private TextToSpeech tts;
              private boolean ready = false;
              private boolean paused = false;
              private boolean playing = false;
              private float rate = 0.9f;
              private String title = "15 Dakikada Gelişim";

              private final ArrayList<String> chunks = new ArrayList<>();
              private int index = 0;

              private MediaSession mediaSession;
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();

                  mediaSession = new MediaSession(this, "GelisimTTS");
                  mediaSession.setActive(true);

                  mediaSession.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { resumePlayback(); }
                      @Override public void onPause() { pausePlayback(); }
                      @Override public void onStop() { stopPlayback(); }
                      @Override public void onSkipToNext() { skip(1); }
                      @Override public void onSkipToPrevious() { skip(-1); }
                  });

                  PowerManager pm =
                          (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(
                          PowerManager.PARTIAL_WAKE_LOCK,
                          "GelisimTTS:Playback");

                  tts = new TextToSpeech(this, this);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) return START_NOT_STICKY;

                  String action = intent.getAction();

                  if (ACTION_PLAY_TEXT.equals(action)) {
                      String text = intent.getStringExtra(EXTRA_TEXT);
                      String newTitle = intent.getStringExtra(EXTRA_TITLE);
                      float newRate =
                              intent.getFloatExtra(EXTRA_RATE, rate);

                      boolean same =
                              newTitle != null &&
                              newTitle.equals(title) &&
                              !chunks.isEmpty();

                      if (same) {
                          if (paused) resumePlayback();
                          else pausePlayback();
                      } else {
                          startNew(newTitle, text, newRate);
                      }

                  } else if (ACTION_TOGGLE.equals(action)) {
                      if (paused) resumePlayback();
                      else pausePlayback();

                  } else if (ACTION_STOP.equals(action)) {
                      stopPlayback();

                  } else if (ACTION_SKIP.equals(action)) {
                      skip(intent.getIntExtra(EXTRA_DELTA, 1));
                  }

                  return START_NOT_STICKY;
              }

              private void startNew(
                      String newTitle,
                      String text,
                      float newRate) {

                  if (text == null || text.trim().isEmpty()) {
                      stopSelf();
                      return;
                  }

                  title =
                      newTitle == null || newTitle.trim().isEmpty()
                          ? "15 Dakikada Gelişim"
                          : newTitle;

                  rate = clamp(newRate);

                  chunks.clear();
                  chunks.addAll(split(text));

                  index = 0;
                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  startForeground(
                          NOTIFICATION_ID,
                          buildNotification());

                  updateMediaState();

                  if (ready) speakCurrent();
              }

              private void pausePlayback() {
                  if (chunks.isEmpty()) return;

                  paused = true;
                  playing = false;

                  if (tts != null) tts.stop();

                  updateNotification();
                  updateMediaState();
              }

              private void resumePlayback() {
                  if (chunks.isEmpty()) return;

                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  if (ready) speakCurrent();

                  updateNotification();
                  updateMediaState();
              }

              private void skip(int delta) {
                  if (chunks.isEmpty()) return;

                  if (tts != null) tts.stop();

                  index = Math.max(
                      0,
                      Math.min(
                          chunks.size() - 1,
                          index + delta));

                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  if (ready) speakCurrent();

                  updateNotification();
                  updateMediaState();
              }

              private void stopPlayback() {
                  playing = false;
                  paused = false;

                  if (tts != null) tts.stop();

                  chunks.clear();
                  index = 0;

                  releaseWakeLock();

                  if (mediaSession != null) {
                      PlaybackState ps =
                          new PlaybackState.Builder()
                              .setState(
                                  PlaybackState.STATE_STOPPED,
                                  0,
                                  0f)
                              .build();
                      mediaSession.setPlaybackState(ps);
                  }

                  stopForeground(true);
                  stopSelf();
              }

              private void speakCurrent() {
                  if (!ready ||
                      !playing ||
                      paused ||
                      chunks.isEmpty()) return;

                  if (index >= chunks.size()) {
                      stopPlayback();
                      return;
                  }

                  tts.setSpeechRate(rate);

                  String utteranceId =
                          "chunk-" + index;

                  tts.speak(
                      chunks.get(index),
                      TextToSpeech.QUEUE_FLUSH,
                      null,
                      utteranceId);

                  updateNotification();
              }

              @Override
              public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS)
                      return;

                  ready = true;

                  int langResult = tts.setLanguage(
                      new Locale("tr", "TR"));

                  if (langResult == TextToSpeech.LANG_MISSING_DATA ||
                      langResult == TextToSpeech.LANG_NOT_SUPPORTED) {
                      android.widget.Toast.makeText(
                          this,
                          "Telefonda Türkçe metin okuma sesi bulunamadı. "
                              + "Ayarlar > Genel yönetim > Metin okuma bölümünü kontrol et.",
                          android.widget.Toast.LENGTH_LONG)
                          .show();
                  }

                  tts.setSpeechRate(rate);

                  tts.setAudioAttributes(
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_MEDIA)
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build());

                  tts.setOnUtteranceProgressListener(
                      new UtteranceProgressListener() {

                          @Override
                          public void onStart(
                              String utteranceId) {}

                          @Override
                          public void onDone(
                              String utteranceId) {

                              if (!playing || paused)
                                  return;

                              index++;

                              if (index >= chunks.size())
                                  stopPlayback();
                              else
                                  speakCurrent();
                          }

                          @Override
                          public void onError(
                              String utteranceId) {

                              paused = true;
                              playing = false;

                              updateNotification();
                              updateMediaState();
                          }
                      });

                  if (playing &&
                      !paused &&
                      !chunks.isEmpty()) {
                      speakCurrent();
                  }
              }

              private ArrayList<String> split(String text) {
                  ArrayList<String> out =
                      new ArrayList<>();

                  String cleaned =
                      text.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();

                  Pattern p =
                      Pattern.compile(
                          "[^.!?…]+[.!?…]+|[^.!?…]+$");

                  Matcher m =
                      p.matcher(cleaned);

                  StringBuilder b =
                      new StringBuilder();

                  while (m.find()) {
                      String sentence =
                          m.group().trim();

                      if (b.length() > 0 &&
                          b.length() +
                          sentence.length() > 700) {

                          out.add(
                              b.toString().trim());

                          b.setLength(0);
                      }

                      if (b.length() > 0)
                          b.append(' ');

                      b.append(sentence);
                  }

                  if (b.length() > 0)
                      out.add(
                          b.toString().trim());

                  if (out.isEmpty())
                      out.add(cleaned);

                  return out;
              }

              private float clamp(float v) {
                  return Math.max(
                      0.6f,
                      Math.min(1.4f, v));
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch =
                          new NotificationChannel(
                              CHANNEL,
                              "Sesli Dinleme",
                              NotificationManager.IMPORTANCE_LOW);

                      ch.setDescription(
                          "Ekran kapalıyken Türkçe TTS");

                      getSystemService(
                          NotificationManager.class)
                          .createNotificationChannel(ch);
                  }
              }

              private PendingIntent serviceIntent(
                      String action,
                      int requestCode,
                      int delta) {

                  Intent i =
                      new Intent(
                          this,
                          TtsPlaybackService.class);

                  i.setAction(action);
                  i.putExtra(
                      EXTRA_DELTA,
                      delta);

                  return PendingIntent.getService(
                      this,
                      requestCode,
                      i,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                      PendingIntent.FLAG_IMMUTABLE);
              }

              private Notification buildNotification() {
                  Intent open =
                      new Intent(
                          this,
                          MainActivity.class);

                  PendingIntent content =
                      PendingIntent.getActivity(
                          this,
                          90,
                          open,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE);

                  String progress =
                      chunks.isEmpty()
                          ? ""
                          : (Math.min(
                                  index + 1,
                                  chunks.size())
                              + " / "
                              + chunks.size());

                  Notification.Action prev =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_media_rew,
                          "Geri",
                          serviceIntent(
                              ACTION_SKIP,
                              1,
                              -1))
                          .build();

                  Notification.Action toggle =
                      new Notification.Action.Builder(
                          paused
                              ? android.R.drawable.ic_media_play
                              : android.R.drawable.ic_media_pause,
                          paused
                              ? "Devam"
                              : "Duraklat",
                          serviceIntent(
                              ACTION_TOGGLE,
                              2,
                              0))
                          .build();

                  Notification.Action next =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_media_ff,
                          "İleri",
                          serviceIntent(
                              ACTION_SKIP,
                              3,
                              1))
                          .build();

                  Notification.Action stop =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_menu_close_clear_cancel,
                          "Durdur",
                          serviceIntent(
                              ACTION_STOP,
                              4,
                              0))
                          .build();

                  Notification.MediaStyle style =
                      new Notification.MediaStyle()
                          .setMediaSession(
                              mediaSession.getSessionToken())
                          .setShowActionsInCompactView(
                              0, 1, 2);

                  return new Notification.Builder(
                          this,
                          CHANNEL)
                      .setSmallIcon(
                          android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText(
                          (paused
                              ? "Duraklatıldı"
                              : "Türkçe dinleniyor")
                          + (progress.isEmpty()
                              ? ""
                              : " · " + progress))
                      .setContentIntent(content)
                      .setOnlyAlertOnce(true)
                      .setOngoing(playing && !paused)
                      .setVisibility(
                          Notification.VISIBILITY_PUBLIC)
                      .addAction(prev)
                      .addAction(toggle)
                      .addAction(next)
                      .addAction(stop)
                      .setStyle(style)
                      .build();
              }

              private void updateNotification() {
                  if (chunks.isEmpty()) return;

                  NotificationManager nm =
                      (NotificationManager)
                          getSystemService(
                              NOTIFICATION_SERVICE);

                  nm.notify(
                      NOTIFICATION_ID,
                      buildNotification());
              }

              private void updateMediaState() {
                  if (mediaSession == null) return;

                  int s =
                      paused
                          ? PlaybackState.STATE_PAUSED
                          : playing
                              ? PlaybackState.STATE_PLAYING
                              : PlaybackState.STATE_STOPPED;

                  long actions =
                      PlaybackState.ACTION_PLAY |
                      PlaybackState.ACTION_PAUSE |
                      PlaybackState.ACTION_PLAY_PAUSE |
                      PlaybackState.ACTION_SKIP_TO_NEXT |
                      PlaybackState.ACTION_SKIP_TO_PREVIOUS |
                      PlaybackState.ACTION_STOP;

                  PlaybackState ps =
                      new PlaybackState.Builder()
                          .setActions(actions)
                          .setState(
                              s,
                              index,
                              playing ? 1f : 0f)
                          .build();

                  mediaSession.setPlaybackState(ps);
              }

              private void ensureWakeLock() {
                  if (wakeLock != null &&
                      !wakeLock.isHeld()) {
                      wakeLock.acquire(
                          6 * 60 * 60 * 1000L);
                  }
              }

              private void releaseWakeLock() {
                  if (wakeLock != null &&
                      wakeLock.isHeld()) {
                      wakeLock.release();
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  if (mediaSession != null)
                      mediaSession.release();

                  releaseWakeLock();

                  super.onDestroy();
              }
          }
