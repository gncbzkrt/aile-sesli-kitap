name: APK Oluştur - Native Alt Oynatıcı v6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/guncelgelisim/app
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OnBesDakikadaGelisim'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.guncelgelisim.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.guncelgelisim.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 5
                  versionName '1.4.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#101416"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#F0A62A"
                  android:pathData="M54,15a39,39 0,1 0,0 78a39,39 0,1 0,0 -78"/>
              <path
                  android:fillColor="#101416"
                  android:pathData="M45,35L45,73L77,54Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="15 Dakikada Gelişim"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TtsPlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/guncelgelisim/app/MainActivity.java <<'EOF'
          package com.guncelgelisim.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private static final String APP_URL =
                      "https://gncbzkrt.github.io/aile-sesli-kitap/";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.POST_NOTIFICATIONS}, 10);
                  }

                  FrameLayout root = new FrameLayout(this);

                  webView = new WebView(this);
                  root.addView(
                      webView,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  LinearLayout controls = new LinearLayout(this);
                  controls.setOrientation(LinearLayout.HORIZONTAL);
                  controls.setGravity(Gravity.CENTER);
                  controls.setPadding(8, 8, 8, 8);
                  controls.setBackgroundColor(Color.rgb(24, 28, 31));

                  Button testButton = new Button(this);
                  testButton.setText("🔊 Test");

                  Button playButton = new Button(this);
                  playButton.setText("▶ Dinle");

                  Button pauseButton = new Button(this);
                  pauseButton.setText("⏯");

                  Button stopButton = new Button(this);
                  stopButton.setText("■");

                  LinearLayout.LayoutParams small =
                      new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f);

                  LinearLayout.LayoutParams large =
                      new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          2f);

                  controls.addView(testButton, small);
                  controls.addView(playButton, large);
                  controls.addView(pauseButton, small);
                  controls.addView(stopButton, small);

                  FrameLayout.LayoutParams cp =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);

                  cp.gravity = Gravity.BOTTOM;
                  root.addView(controls, cp);

                  webView.setPadding(0, 0, 0, 88);
                  webView.setClipToPadding(false);

                  setContentView(root);

                  testButton.setOnClickListener(v ->
                      startNativeText(
                          "Ses Testi",
                          "Türkçe ses sistemi çalışıyor. "
                              + "Ekranı kapattığında da bu sesin devam etmesi gerekir.",
                          0.9f));

                  playButton.setOnClickListener(v ->
                      playSelectedFromPage());

                  pauseButton.setOnClickListener(v ->
                      sendSimpleAction(
                          TtsPlaybackService.ACTION_TOGGLE));

                  stopButton.setOnClickListener(v ->
                      sendSimpleAction(
                          TtsPlaybackService.ACTION_STOP));

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(
                          new AndroidTtsBridge(this), "AndroidTTS");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          installNativeHint();
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              private void installNativeHint() {
                  String js =
                      "javascript:(function(){" +
                      "if(window.__ANDROID_NATIVE_BAR__)return;" +
                      "window.__ANDROID_NATIVE_BAR__=true;" +
                      "var p=document.querySelector('#play');" +
                      "if(p){" +
                      "p.textContent='↓ Android oynatıcıyı kullan';" +
                      "p.disabled=true;" +
                      "p.style.opacity='0.55';" +
                      "}" +
                      "})();";
                  webView.evaluateJavascript(js, null);
              }

              private void playSelectedFromPage() {
                  String js =
                      "(function(){" +
                      "var s=document.querySelector('#summary');" +
                      "var h=document.querySelector('#playerTitle');" +
                      "var r=document.querySelector('#rate');" +
                      "return JSON.stringify({" +
                      "title:String(h&&h.innerText?h.innerText:'')," +
                      "text:String(s&&s.innerText?s.innerText:'').trim()," +
                      "rate:Number(r&&r.value?r.value:0.9)||0.9" +
                      "});" +
                      "})()";

                  webView.evaluateJavascript(
                      js,
                      value -> {
                          try {
                              if (value == null ||
                                  "null".equals(value)) {
                                  Toast.makeText(
                                      this,
                                      "Önce bir içerik aç.",
                                      Toast.LENGTH_LONG)
                                      .show();
                                  return;
                              }

                              String decoded =
                                  new JSONArray(
                                      "[" + value + "]")
                                      .getString(0);

                              JSONObject o =
                                  new JSONObject(decoded);

                              String title =
                                  o.optString(
                                      "title",
                                      "15 Dakikada Gelişim");

                              String text =
                                  o.optString("text", "");

                              float rate =
                                  (float) o.optDouble(
                                      "rate",
                                      0.9);

                              if (text.trim().isEmpty()) {
                                  Toast.makeText(
                                      this,
                                      "Önce bir içerik kartına dokunup "
                                          + "özet ekranını aç.",
                                      Toast.LENGTH_LONG)
                                      .show();
                                  return;
                              }

                              startNativeText(
                                  title,
                                  text,
                                  rate);

                          } catch (Exception ex) {
                              Toast.makeText(
                                  this,
                                  "Metin alınamadı: "
                                      + ex.getClass().getSimpleName(),
                                  Toast.LENGTH_LONG)
                                  .show();
                          }
                      });
              }

              private void startNativeText(
                      String title,
                      String text,
                      float rate) {

                  Intent i =
                      new Intent(
                          this,
                          TtsPlaybackService.class);

                  i.setAction(
                      TtsPlaybackService.ACTION_PLAY_TEXT);

                  i.putExtra(
                      TtsPlaybackService.EXTRA_TITLE,
                      title);

                  i.putExtra(
                      TtsPlaybackService.EXTRA_TEXT,
                      text);

                  i.putExtra(
                      TtsPlaybackService.EXTRA_RATE,
                      rate);

                  try {
                      if (Build.VERSION.SDK_INT >= 26)
                          startForegroundService(i);
                      else
                          startService(i);
                  } catch (Exception ex) {
                      Toast.makeText(
                          this,
                          "Ses başlatılamadı: "
                              + ex.getClass().getSimpleName(),
                          Toast.LENGTH_LONG)
                          .show();
                  }
              }

              private void sendSimpleAction(
                      String action) {

                  Intent i =
                      new Intent(
                          this,
                          TtsPlaybackService.class);

                  i.setAction(action);

                  try {
                      startService(i);
                  } catch (Exception ex) {
                      Toast.makeText(
                          this,
                          "Ses kontrolü çalışmadı.",
                          Toast.LENGTH_SHORT)
                          .show();
                  }
              }

              public static class AndroidTtsBridge {
                  private final Context context;

                  AndroidTtsBridge(Context c) {
                      context = c.getApplicationContext();
                  }

                  private void send(
                          String action,
                          String title,
                          String text,
                          float rate,
                          int delta) {

                      new android.os.Handler(
                              android.os.Looper.getMainLooper())
                          .post(() -> {
                              Intent i = new Intent(
                                  context,
                                  TtsPlaybackService.class);
                              i.setAction(action);

                              if (title != null)
                                  i.putExtra(
                                      TtsPlaybackService.EXTRA_TITLE,
                                      title);
                              if (text != null)
                                  i.putExtra(
                                      TtsPlaybackService.EXTRA_TEXT,
                                      text);

                              i.putExtra(
                                  TtsPlaybackService.EXTRA_RATE,
                                  rate);
                              i.putExtra(
                                  TtsPlaybackService.EXTRA_DELTA,
                                  delta);

                              try {
                                  if (TtsPlaybackService.ACTION_PLAY_TEXT.equals(action)
                                          && Build.VERSION.SDK_INT >= 26) {
                                      context.startForegroundService(i);
                                  } else {
                                      context.startService(i);
                                  }
                              } catch (Exception ex) {
                                  android.widget.Toast.makeText(
                                      context,
                                      "Ses servisi başlatılamadı: "
                                          + ex.getClass().getSimpleName(),
                                      android.widget.Toast.LENGTH_LONG)
                                      .show();
                              }
                          });
                  }

                  @JavascriptInterface
                  public void toggle(String title, String text, double rate) {
                      send(
                          TtsPlaybackService.ACTION_PLAY_TEXT,
                          title,
                          text,
                          (float) rate,
                          0);
                  }

                  @JavascriptInterface
                  public void stop() {
                      send(
                          TtsPlaybackService.ACTION_STOP,
                          null,
                          null,
                          1f,
                          0);
                  }

                  @JavascriptInterface
                  public void skip(int delta) {
                      send(
                          TtsPlaybackService.ACTION_SKIP,
                          null,
                          null,
                          1f,
                          delta);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/guncelgelisim/app/TtsPlaybackService.java <<'EOF'
          package com.guncelgelisim.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;

          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class TtsPlaybackService extends Service
                  implements TextToSpeech.OnInitListener {

              public static final String ACTION_PLAY_TEXT =
                      "com.guncelgelisim.PLAY_TEXT";
              public static final String ACTION_TOGGLE =
                      "com.guncelgelisim.TOGGLE";
              public static final String ACTION_STOP =
                      "com.guncelgelisim.STOP";
              public static final String ACTION_SKIP =
                      "com.guncelgelisim.SKIP";

              public static final String EXTRA_TITLE = "title";
              public static final String EXTRA_TEXT = "text";
              public static final String EXTRA_RATE = "rate";
              public static final String EXTRA_DELTA = "delta";

              private static final String CHANNEL = "gelisim_tts";
              private static final int NOTIFICATION_ID = 1515;

              private TextToSpeech tts;
              private boolean ready = false;
              private boolean paused = false;
              private boolean playing = false;
              private float rate = 0.9f;
              private String title = "15 Dakikada Gelişim";

              private final ArrayList<String> chunks = new ArrayList<>();
              private int index = 0;

              private MediaSession mediaSession;
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();

                  mediaSession = new MediaSession(this, "GelisimTTS");
                  mediaSession.setActive(true);

                  mediaSession.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { resumePlayback(); }
                      @Override public void onPause() { pausePlayback(); }
                      @Override public void onStop() { stopPlayback(); }
                      @Override public void onSkipToNext() { skip(1); }
                      @Override public void onSkipToPrevious() { skip(-1); }
                  });

                  PowerManager pm =
                          (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(
                          PowerManager.PARTIAL_WAKE_LOCK,
                          "GelisimTTS:Playback");

                  tts = new TextToSpeech(this, this);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) return START_NOT_STICKY;

                  String action = intent.getAction();

                  if (ACTION_PLAY_TEXT.equals(action)) {
                      String text = intent.getStringExtra(EXTRA_TEXT);
                      String newTitle = intent.getStringExtra(EXTRA_TITLE);
                      float newRate =
                              intent.getFloatExtra(EXTRA_RATE, rate);

                      boolean same =
                              newTitle != null &&
                              newTitle.equals(title) &&
                              !chunks.isEmpty();

                      if (same) {
                          if (paused) resumePlayback();
                          else pausePlayback();
                      } else {
                          startNew(newTitle, text, newRate);
                      }

                  } else if (ACTION_TOGGLE.equals(action)) {
                      if (paused) resumePlayback();
                      else pausePlayback();

                  } else if (ACTION_STOP.equals(action)) {
                      stopPlayback();

                  } else if (ACTION_SKIP.equals(action)) {
                      skip(intent.getIntExtra(EXTRA_DELTA, 1));
                  }

                  return START_NOT_STICKY;
              }

              private void startNew(
                      String newTitle,
                      String text,
                      float newRate) {

                  if (text == null || text.trim().isEmpty()) {
                      stopSelf();
                      return;
                  }

                  title =
                      newTitle == null || newTitle.trim().isEmpty()
                          ? "15 Dakikada Gelişim"
                          : newTitle;

                  rate = clamp(newRate);

                  chunks.clear();
                  chunks.addAll(split(text));

                  index = 0;
                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  startForeground(
                          NOTIFICATION_ID,
                          buildNotification());

                  updateMediaState();

                  if (ready) speakCurrent();
              }

              private void pausePlayback() {
                  if (chunks.isEmpty()) return;

                  paused = true;
                  playing = false;

                  if (tts != null) tts.stop();

                  updateNotification();
                  updateMediaState();
              }

              private void resumePlayback() {
                  if (chunks.isEmpty()) return;

                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  if (ready) speakCurrent();

                  updateNotification();
                  updateMediaState();
              }

              private void skip(int delta) {
                  if (chunks.isEmpty()) return;

                  if (tts != null) tts.stop();

                  index = Math.max(
                      0,
                      Math.min(
                          chunks.size() - 1,
                          index + delta));

                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  if (ready) speakCurrent();

                  updateNotification();
                  updateMediaState();
              }

              private void stopPlayback() {
                  playing = false;
                  paused = false;

                  if (tts != null) tts.stop();

                  chunks.clear();
                  index = 0;

                  releaseWakeLock();

                  if (mediaSession != null) {
                      PlaybackState ps =
                          new PlaybackState.Builder()
                              .setState(
                                  PlaybackState.STATE_STOPPED,
                                  0,
                                  0f)
                              .build();
                      mediaSession.setPlaybackState(ps);
                  }

                  stopForeground(true);
                  stopSelf();
              }

              private void speakCurrent() {
                  if (!ready ||
                      !playing ||
                      paused ||
                      chunks.isEmpty()) return;

                  if (index >= chunks.size()) {
                      stopPlayback();
                      return;
                  }

                  tts.setSpeechRate(rate);

                  String utteranceId =
                          "chunk-" + index;

                  tts.speak(
                      chunks.get(index),
                      TextToSpeech.QUEUE_FLUSH,
                      null,
                      utteranceId);

                  updateNotification();
              }

              @Override
              public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS)
                      return;

                  ready = true;

                  int langResult = tts.setLanguage(
                      new Locale("tr", "TR"));

                  if (langResult == TextToSpeech.LANG_MISSING_DATA ||
                      langResult == TextToSpeech.LANG_NOT_SUPPORTED) {
                      android.widget.Toast.makeText(
                          this,
                          "Telefonda Türkçe metin okuma sesi bulunamadı. "
                              + "Ayarlar > Genel yönetim > Metin okuma bölümünü kontrol et.",
                          android.widget.Toast.LENGTH_LONG)
                          .show();
                  }

                  tts.setSpeechRate(rate);

                  tts.setAudioAttributes(
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_MEDIA)
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build());

                  tts.setOnUtteranceProgressListener(
                      new UtteranceProgressListener() {

                          @Override
                          public void onStart(
                              String utteranceId) {}

                          @Override
                          public void onDone(
                              String utteranceId) {

                              if (!playing || paused)
                                  return;

                              index++;

                              if (index >= chunks.size())
                                  stopPlayback();
                              else
                                  speakCurrent();
                          }

                          @Override
                          public void onError(
                              String utteranceId) {

                              paused = true;
                              playing = false;

                              updateNotification();
                              updateMediaState();
                          }
                      });

                  if (playing &&
                      !paused &&
                      !chunks.isEmpty()) {
                      speakCurrent();
                  }
              }

              private ArrayList<String> split(String text) {
                  ArrayList<String> out =
                      new ArrayList<>();

                  String cleaned =
                      text.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();

                  Pattern p =
                      Pattern.compile(
                          "[^.!?…]+[.!?…]+|[^.!?…]+$");

                  Matcher m =
                      p.matcher(cleaned);

                  StringBuilder b =
                      new StringBuilder();

                  while (m.find()) {
                      String sentence =
                          m.group().trim();

                      if (b.length() > 0 &&
                          b.length() +
                          sentence.length() > 700) {

                          out.add(
                              b.toString().trim());

                          b.setLength(0);
                      }

                      if (b.length() > 0)
                          b.append(' ');

                      b.append(sentence);
                  }

                  if (b.length() > 0)
                      out.add(
                          b.toString().trim());

                  if (out.isEmpty())
                      out.add(cleaned);

                  return out;
              }

              private float clamp(float v) {
                  return Math.max(
                      0.6f,
                      Math.min(1.4f, v));
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch =
                          new NotificationChannel(
                              CHANNEL,
                              "Sesli Dinleme",
                              NotificationManager.IMPORTANCE_LOW);

                      ch.setDescription(
                          "Ekran kapalıyken Türkçe TTS");

                      getSystemService(
                          NotificationManager.class)
                          .createNotificationChannel(ch);
                  }
              }

              private PendingIntent serviceIntent(
                      String action,
                      int requestCode,
                      int delta) {

                  Intent i =
                      new Intent(
                          this,
                          TtsPlaybackService.class);

                  i.setAction(action);
                  i.putExtra(
                      EXTRA_DELTA,
                      delta);

                  return PendingIntent.getService(
                      this,
                      requestCode,
                      i,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                      PendingIntent.FLAG_IMMUTABLE);
              }

              private Notification buildNotification() {
                  Intent open =
                      new Intent(
                          this,
                          MainActivity.class);

                  PendingIntent content =
                      PendingIntent.getActivity(
                          this,
                          90,
                          open,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE);

                  String progress =
                      chunks.isEmpty()
                          ? ""
                          : (Math.min(
                                  index + 1,
                                  chunks.size())
                              + " / "
                              + chunks.size());

                  Notification.Action prev =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_media_rew,
                          "Geri",
                          serviceIntent(
                              ACTION_SKIP,
                              1,
                              -1))
                          .build();

                  Notification.Action toggle =
                      new Notification.Action.Builder(
                          paused
                              ? android.R.drawable.ic_media_play
                              : android.R.drawable.ic_media_pause,
                          paused
                              ? "Devam"
                              : "Duraklat",
                          serviceIntent(
                              ACTION_TOGGLE,
                              2,
                              0))
                          .build();

                  Notification.Action next =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_media_ff,
                          "İleri",
                          serviceIntent(
                              ACTION_SKIP,
                              3,
                              1))
                          .build();

                  Notification.Action stop =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_menu_close_clear_cancel,
                          "Durdur",
                          serviceIntent(
                              ACTION_STOP,
                              4,
                              0))
                          .build();

                  Notification.MediaStyle style =
                      new Notification.MediaStyle()
                          .setMediaSession(
                              mediaSession.getSessionToken())
                          .setShowActionsInCompactView(
                              0, 1, 2);

                  return new Notification.Builder(
                          this,
                          CHANNEL)
                      .setSmallIcon(
                          android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText(
                          (paused
                              ? "Duraklatıldı"
                              : "Türkçe dinleniyor")
                          + (progress.isEmpty()
                              ? ""
                              : " · " + progress))
                      .setContentIntent(content)
                      .setOnlyAlertOnce(true)
                      .setOngoing(playing && !paused)
                      .setVisibility(
                          Notification.VISIBILITY_PUBLIC)
                      .addAction(prev)
                      .addAction(toggle)
                      .addAction(next)
                      .addAction(stop)
                      .setStyle(style)
                      .build();
              }

              private void updateNotification() {
                  if (chunks.isEmpty()) return;

                  NotificationManager nm =
                      (NotificationManager)
                          getSystemService(
                              NOTIFICATION_SERVICE);

                  nm.notify(
                      NOTIFICATION_ID,
                      buildNotification());
              }

              private void updateMediaState() {
                  if (mediaSession == null) return;

                  int s =
                      paused
                          ? PlaybackState.STATE_PAUSED
                          : playing
                              ? PlaybackState.STATE_PLAYING
                              : PlaybackState.STATE_STOPPED;

                  long actions =
                      PlaybackState.ACTION_PLAY |
                      PlaybackState.ACTION_PAUSE |
                      PlaybackState.ACTION_PLAY_PAUSE |
                      PlaybackState.ACTION_SKIP_TO_NEXT |
                      PlaybackState.ACTION_SKIP_TO_PREVIOUS |
                      PlaybackState.ACTION_STOP;

                  PlaybackState ps =
                      new PlaybackState.Builder()
                          .setActions(actions)
                          .setState(
                              s,
                              index,
                              playing ? 1f : 0f)
                          .build();

                  mediaSession.setPlaybackState(ps);
              }

              private void ensureWakeLock() {
                  if (wakeLock != null &&
                      !wakeLock.isHeld()) {
                      wakeLock.acquire(
                          6 * 60 * 60 * 1000L);
                  }
              }

              private void releaseWakeLock() {
                  if (wakeLock != null &&
                      wakeLock.isHeld()) {
                      wakeLock.release();
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  if (mediaSession != null)
                      mediaSession.release();

                  releaseWakeLock();

                  super.onDestroy();
              }
          }
