name: APK Oluştur - Tek Dosya

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/guncelgelisim/app
          cat > 'settings.gradle' <<'EOF_SETTINGS_GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'OnBesDakikadaGelisim'
          include ':app'
          EOF_SETTINGS_GRADLE

          cat > 'build.gradle' <<'EOF_BUILD_GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_BUILD_GRADLE

          cat > 'app/build.gradle' <<'EOF_APP_BUILD_GRADLE'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.guncelgelisim.app'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'com.guncelgelisim.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          
          dependencies {
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF_APP_BUILD_GRADLE

          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_APP_SRC_MAIN_ANDROIDMANIFEST_XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:label="15 Dakikada Gelişim"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TtsPlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF_APP_SRC_MAIN_ANDROIDMANIFEST_XML

          cat > 'app/src/main/java/com/guncelgelisim/app/MainActivity.java' <<'EOF_APP_SRC_MAIN_JAVA_COM_GUNCELGELISIM_APP_MAINACTIVITY_JAVA'
          package com.guncelgelisim.app;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          public class MainActivity extends Activity {
              private static final String APP_URL = "https://gncbzkrt.github.io/aile-sesli-kitap/";
              private WebView webView;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 10);
                  }
          
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new AndroidTtsBridge(this), "AndroidTTS");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectNativeTtsControls();
                      }
                  });
                  webView.loadUrl(APP_URL);
              }
          
              private void injectNativeTtsControls() {
                  String js = "javascript:(function(){" +
                          "if(window.__ANDROID_TTS_HOOKED)return;window.__ANDROID_TTS_HOOKED=true;" +
                          "function hook(){" +
                          "var p=document.querySelector('#play');" +
                          "if(p){p.onclick=function(e){e&&e.stopImmediatePropagation();var t=document.querySelector('#summary');var title=document.querySelector('#playerTitle');var rate=document.querySelector('#rate');if(!t||!t.innerText.trim())return;AndroidTTS.toggle(String(title?title.innerText:'15 Dakikada Gelişim'),String(t.innerText),Number(rate?rate.value:0.9));p.textContent='⏯ Duraklat / Devam';return false;};}" +
                          "var b=document.querySelector('#back');if(b){b.onclick=function(e){e&&e.stopImmediatePropagation();AndroidTTS.skip(-1);return false;};}" +
                          "var f=document.querySelector('#forward');if(f){f.onclick=function(e){e&&e.stopImmediatePropagation();AndroidTTS.skip(1);return false;};}" +
                          "var c=document.querySelector('#closePlayer');if(c&&!c.__nativeBound){c.__nativeBound=true;c.addEventListener('click',function(){AndroidTTS.stop();});}" +
                          "var r=document.querySelector('#rate');if(r&&!r.__nativeBound){r.__nativeBound=true;r.addEventListener('input',function(){AndroidTTS.setRate(Number(r.value||0.9));});}" +
                          "var g=document.querySelector('#grid');if(g&&!g.__nativeBound){g.__nativeBound=true;g.addEventListener('click',function(ev){var el=ev.target.closest&&ev.target.closest('[data-open]');if(el)AndroidTTS.stop();},true);}" +
                          "}" +
                          "hook();setInterval(hook,1200);" +
                          "})();";
                  webView.evaluateJavascript(js, null);
              }
          
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
          
              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          
              static class AndroidTtsBridge {
                  private final Context context;
                  AndroidTtsBridge(Context context) { this.context = context.getApplicationContext(); }
          
                  private void send(String action, String title, String text, float rate, int delta) {
                      Intent i = new Intent(context, TtsPlaybackService.class);
                      i.setAction(action);
                      if (title != null) i.putExtra(TtsPlaybackService.EXTRA_TITLE, title);
                      if (text != null) i.putExtra(TtsPlaybackService.EXTRA_TEXT, text);
                      i.putExtra(TtsPlaybackService.EXTRA_RATE, rate);
                      i.putExtra(TtsPlaybackService.EXTRA_DELTA, delta);
                      if (ACTION_TOGGLE_WITH_TEXT.equals(action) && Build.VERSION.SDK_INT >= 26) context.startForegroundService(i); else context.startService(i);
                  }
          
                  @JavascriptInterface public void toggle(String title, String text, double rate) {
                      send(TtsPlaybackService.ACTION_TOGGLE_WITH_TEXT, title, text, (float)rate, 0);
                  }
                  @JavascriptInterface public void stop() {
                      send(TtsPlaybackService.ACTION_STOP, null, null, 1f, 0);
                  }
                  @JavascriptInterface public void skip(int delta) {
                      send(TtsPlaybackService.ACTION_SKIP, null, null, 1f, delta);
                  }
                  @JavascriptInterface public void setRate(double rate) {
                      send(TtsPlaybackService.ACTION_RATE, null, null, (float)rate, 0);
                  }
              }
          }
          EOF_APP_SRC_MAIN_JAVA_COM_GUNCELGELISIM_APP_MAINACTIVITY_JAVA

          cat > 'app/src/main/java/com/guncelgelisim/app/TtsPlaybackService.java' <<'EOF_APP_SRC_MAIN_JAVA_COM_GUNCELGELISIM_APP_TTSPLAYBACKSERVICE_JAVA'
          package com.guncelgelisim.app;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          
          import androidx.core.app.NotificationCompat;
          import androidx.media.app.NotificationCompat.MediaStyle;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;
          
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          public class TtsPlaybackService extends Service implements TextToSpeech.OnInitListener {
              public static final String ACTION_TOGGLE_WITH_TEXT = "com.guncelgelisim.TOGGLE_TEXT";
              public static final String ACTION_TOGGLE = "com.guncelgelisim.TOGGLE";
              public static final String ACTION_STOP = "com.guncelgelisim.STOP";
              public static final String ACTION_SKIP = "com.guncelgelisim.SKIP";
              public static final String ACTION_RATE = "com.guncelgelisim.RATE";
              public static final String EXTRA_TITLE = "title";
              public static final String EXTRA_TEXT = "text";
              public static final String EXTRA_RATE = "rate";
              public static final String EXTRA_DELTA = "delta";
          
              private static final String CHANNEL = "gelisim_tts";
              private static final int NOTIFICATION_ID = 1515;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private boolean paused = false;
              private boolean speaking = false;
              private float rate = 0.9f;
              private String title = "15 Dakikada Gelişim";
              private final ArrayList<String> chunks = new ArrayList<>();
              private int index = 0;
              private MediaSessionCompat mediaSession;
              private PowerManager.WakeLock wakeLock;
          
              @Override public void onCreate() {
                  super.onCreate();
                  createChannel();
                  tts = new TextToSpeech(this, this);
                  mediaSession = new MediaSessionCompat(this, "GelisimTTS");
                  mediaSession.setActive(true);
                  PowerManager pm = (PowerManager)getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "GelisimTTS:Playback");
              }
          
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) return START_NOT_STICKY;
                  String action = intent.getAction();
                  if (ACTION_TOGGLE_WITH_TEXT.equals(action)) {
                      String incoming = intent.getStringExtra(EXTRA_TEXT);
                      String incomingTitle = intent.getStringExtra(EXTRA_TITLE);
                      float incomingRate = intent.getFloatExtra(EXTRA_RATE, rate);
                      boolean same = incoming != null && !chunks.isEmpty() && incomingTitle != null && incomingTitle.equals(title);
                      if (same) togglePause();
                      else startNew(incomingTitle, incoming, incomingRate);
                  } else if (ACTION_TOGGLE.equals(action)) {
                      togglePause();
                  } else if (ACTION_STOP.equals(action)) {
                      stopPlayback();
                  } else if (ACTION_SKIP.equals(action)) {
                      skip(intent.getIntExtra(EXTRA_DELTA, 1));
                  } else if (ACTION_RATE.equals(action)) {
                      rate = clamp(intent.getFloatExtra(EXTRA_RATE, rate));
                      if (tts != null) tts.setSpeechRate(rate);
                  }
                  return START_NOT_STICKY;
              }
          
              private void startNew(String newTitle, String text, float newRate) {
                  if (text == null || text.trim().isEmpty()) return;
                  title = (newTitle == null || newTitle.trim().isEmpty()) ? "15 Dakikada Gelişim" : newTitle;
                  rate = clamp(newRate);
                  chunks.clear();
                  chunks.addAll(split(text));
                  index = 0;
                  paused = false;
                  speaking = true;
                  ensureWakeLock();
                  startForeground(NOTIFICATION_ID, buildNotification());
                  updateMediaState();
                  if (ttsReady) speakCurrent();
              }
          
              private void togglePause() {
                  if (chunks.isEmpty()) return;
                  if (speaking && !paused) {
                      paused = true;
                      speaking = false;
                      if (tts != null) tts.stop();
                  } else {
                      paused = false;
                      speaking = true;
                      ensureWakeLock();
                      if (ttsReady) speakCurrent();
                  }
                  updateNotification();
                  updateMediaState();
              }
          
              private void skip(int delta) {
                  if (chunks.isEmpty()) return;
                  if (tts != null) tts.stop();
                  index = Math.max(0, Math.min(chunks.size() - 1, index + delta));
                  paused = false;
                  speaking = true;
                  ensureWakeLock();
                  if (ttsReady) speakCurrent();
                  updateNotification();
              }
          
              private void stopPlayback() {
                  speaking = false;
                  paused = false;
                  if (tts != null) tts.stop();
                  chunks.clear();
                  index = 0;
                  releaseWakeLock();
                  if (mediaSession != null) {
                      mediaSession.setPlaybackState(new PlaybackStateCompat.Builder().setState(PlaybackStateCompat.STATE_STOPPED, 0, 0f).build());
                  }
                  stopForeground(true);
                  stopSelf();
              }
          
              private void speakCurrent() {
                  if (!ttsReady || !speaking || paused || chunks.isEmpty()) return;
                  if (index >= chunks.size()) {
                      stopPlayback();
                      return;
                  }
                  tts.setSpeechRate(rate);
                  String utteranceId = "chunk-" + index;
                  tts.speak(chunks.get(index), TextToSpeech.QUEUE_FLUSH, null, utteranceId);
                  updateNotification();
              }
          
              @Override public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS) return;
                  ttsReady = true;
                  int r = tts.setLanguage(new Locale("tr", "TR"));
                  tts.setSpeechRate(rate);
                  tts.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String utteranceId) { }
                      @Override public void onDone(String utteranceId) {
                          if (!speaking || paused) return;
                          index++;
                          if (index >= chunks.size()) stopPlayback(); else speakCurrent();
                      }
                      @Override public void onError(String utteranceId) { speaking = false; paused = true; updateNotification(); }
                  });
                  if (speaking && !paused && !chunks.isEmpty()) speakCurrent();
              }
          
              private ArrayList<String> split(String text) {
                  ArrayList<String> out = new ArrayList<>();
                  String cleaned = text.replace('\u00A0', ' ').replaceAll("\\s+", " ").trim();
                  Pattern p = Pattern.compile("[^.!?…]+[.!?…]+|[^.!?…]+$");
                  Matcher m = p.matcher(cleaned);
                  StringBuilder b = new StringBuilder();
                  while (m.find()) {
                      String s = m.group().trim();
                      if (b.length() > 0 && b.length() + s.length() > 700) {
                          out.add(b.toString().trim());
                          b.setLength(0);
                      }
                      if (b.length() > 0) b.append(' ');
                      b.append(s);
                  }
                  if (b.length() > 0) out.add(b.toString().trim());
                  if (out.isEmpty()) out.add(cleaned.length() > 3500 ? cleaned.substring(0, 3500) : cleaned);
                  return out;
              }
          
              private float clamp(float v) { return Math.max(0.6f, Math.min(1.4f, v)); }
          
              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Sesli Dinleme", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("Ekran kapalıyken Türkçe TTS dinleme");
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
              }
          
              private PendingIntent serviceIntent(String action, int requestCode, int delta) {
                  Intent i = new Intent(this, TtsPlaybackService.class).setAction(action).putExtra(EXTRA_DELTA, delta);
                  return PendingIntent.getService(this, requestCode, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }
          
              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent content = PendingIntent.getActivity(this, 90, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  String progress = chunks.isEmpty() ? "" : (Math.min(index + 1, chunks.size()) + " / " + chunks.size());
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle(title)
                          .setContentText((paused ? "Duraklatıldı" : "Türkçe dinleniyor") + (progress.isEmpty() ? "" : " · " + progress))
                          .setContentIntent(content)
                          .setOnlyAlertOnce(true)
                          .setOngoing(speaking && !paused)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .addAction(android.R.drawable.ic_media_rew, "Geri", serviceIntent(ACTION_SKIP, 1, -1))
                          .addAction(paused ? android.R.drawable.ic_media_play : android.R.drawable.ic_media_pause, paused ? "Devam" : "Duraklat", serviceIntent(ACTION_TOGGLE, 2, 0))
                          .addAction(android.R.drawable.ic_media_ff, "İleri", serviceIntent(ACTION_SKIP, 3, 1))
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Durdur", serviceIntent(ACTION_STOP, 4, 0))
                          .setStyle(new MediaStyle().setMediaSession(mediaSession.getSessionToken()).setShowActionsInCompactView(0,1,2));
                  return b.build();
              }
          
              private void updateNotification() {
                  if (chunks.isEmpty()) return;
                  NotificationManager nm = (NotificationManager)getSystemService(NOTIFICATION_SERVICE);
                  nm.notify(NOTIFICATION_ID, buildNotification());
              }
          
              private void updateMediaState() {
                  int state = paused ? PlaybackStateCompat.STATE_PAUSED : speaking ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_STOPPED;
                  mediaSession.setPlaybackState(new PlaybackStateCompat.Builder()
                          .setActions(PlaybackStateCompat.ACTION_PLAY | PlaybackStateCompat.ACTION_PAUSE | PlaybackStateCompat.ACTION_PLAY_PAUSE | PlaybackStateCompat.ACTION_SKIP_TO_NEXT | PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS | PlaybackStateCompat.ACTION_STOP)
                          .setState(state, index, speaking ? 1f : 0f).build());
              }
          
              private void ensureWakeLock() { if (wakeLock != null && !wakeLock.isHeld()) wakeLock.acquire(6 * 60 * 60 * 1000L); }
              private void releaseWakeLock() { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); }
          
              @Override public IBinder onBind(Intent intent) { return null; }
          
              @Override public void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (mediaSession != null) mediaSession.release();
                  releaseWakeLock();
                  super.onDestroy();
              }
          }
          EOF_APP_SRC_MAIN_JAVA_COM_GUNCELGELISIM_APP_TTSPLAYBACKSERVICE_JAVA

      - name: APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk 15-Dakikada-Gelisim.apk

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: 15-Dakikada-Gelisim-APK
          path: 15-Dakikada-Gelisim.apk
          retention-days: 30
