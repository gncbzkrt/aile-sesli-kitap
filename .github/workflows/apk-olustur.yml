name: APK Oluştur - Tam Native v9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/guncelgelisim/app
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OnBesDakikadaGelisim'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.guncelgelisim.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.guncelgelisim.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 8
                  versionName '2.0.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#101416" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F0A62A" android:pathData="M54,15a39,39 0,1 0,0 78a39,39 0,1 0,0 -78"/>
              <path android:fillColor="#101416" android:pathData="M45,35L45,73L77,54Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="15 Dakikada Gelişim"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TtsPlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/guncelgelisim/app/MainActivity.java <<'EOF'
          package com.guncelgelisim.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ProgressBar;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final String CATALOG_URL =
                  "https://gncbzkrt.github.io/aile-sesli-kitap/catalog.json";

              private final ArrayList<Book> all = new ArrayList<>();
              private final ArrayList<Book> shown = new ArrayList<>();
              private final ArrayList<String> cats = new ArrayList<>();

              private ListView list;
              private Spinner spinner;
              private EditText search;
              private TextView count;
              private ProgressBar progress;
              private BooksAdapter adapter;
              private boolean adultUnlocked = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS}, 10);
                  }

                  buildUi();
                  loadCatalog();
              }

              private int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + .5f);
              }

              private TextView tv(String s, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  return t;
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(12,15,17));
                  root.setPadding(dp(14),dp(12),dp(14),dp(10));

                  TextView title = tv("15 DAKİKADA GELİŞİM",21,Color.WHITE);
                  title.setTypeface(null,android.graphics.Typeface.BOLD);
                  root.addView(title);

                  TextView sub = tv("Native Android · Türkçe · Ekran kapalı dinleme",12,Color.rgb(150,158,164));
                  root.addView(sub);

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);

                  Button refresh = new Button(this);
                  refresh.setText("↻ Katalog");
                  refresh.setOnClickListener(v -> loadCatalog());
                  top.addView(refresh,new LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,1f));

                  Button adult = new Button(this);
                  adult.setText("18+ Aç");
                  adult.setOnClickListener(v -> {
                      if (!adultUnlocked) {
                          new AlertDialog.Builder(this)
                              .setTitle("18+ Yetişkinler")
                              .setMessage("Bu bölüm yetişkinlere yönelik ilişki ve yakınlık eğitimi içerir.")
                              .setNegativeButton("Vazgeç",null)
                              .setPositiveButton("18 yaş ve üzerindeyim",(d,w)->{
                                  adultUnlocked=true;
                                  adult.setText("18+ Kapat");
                                  rebuildCats();
                                  filter();
                              }).show();
                      } else {
                          adultUnlocked=false;
                          adult.setText("18+ Aç");
                          rebuildCats();
                          filter();
                      }
                  });
                  top.addView(adult,new LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,1f));
                  root.addView(top);

                  search = new EditText(this);
                  search.setHint("Konu, kitap, yazar veya beceri ara…");
                  search.setHintTextColor(Color.rgb(120,128,134));
                  search.setTextColor(Color.WHITE);
                  search.setSingleLine(true);
                  search.setBackgroundColor(Color.rgb(23,28,31));
                  search.setPadding(dp(12),dp(10),dp(12),dp(10));
                  root.addView(search,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT));

                  spinner = new Spinner(this);
                  root.addView(spinner);

                  count = tv("Katalog yükleniyor…",13,Color.rgb(170,177,182));
                  root.addView(count);

                  progress = new ProgressBar(this);
                  root.addView(progress);

                  list = new ListView(this);
                  list.setDividerHeight(dp(8));
                  list.setBackgroundColor(Color.TRANSPARENT);
                  adapter = new BooksAdapter();
                  list.setAdapter(adapter);
                  root.addView(list,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,0,1f));

                  LinearLayout player = new LinearLayout(this);
                  player.setOrientation(LinearLayout.HORIZONTAL);

                  Button pause = new Button(this);
                  pause.setText("⏯ Duraklat / Devam");
                  pause.setOnClickListener(v -> sendAction(TtsPlaybackService.ACTION_TOGGLE));

                  Button stop = new Button(this);
                  stop.setText("■ Durdur");
                  stop.setOnClickListener(v -> sendAction(TtsPlaybackService.ACTION_STOP));

                  player.addView(pause,new LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,2f));
                  player.addView(stop,new LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,1f));
                  root.addView(player);

                  setContentView(root);

                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s,int st,int c,int a){}
                      public void onTextChanged(CharSequence s,int st,int b,int c){ filter(); }
                      public void afterTextChanged(Editable e){}
                  });

                  spinner.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      public void onItemSelected(AdapterView<?> p,View v,int pos,long id){ filter(); }
                      public void onNothingSelected(AdapterView<?> p){}
                  });
              }

              private void loadCatalog() {
                  progress.setVisibility(View.VISIBLE);
                  count.setText("Katalog yükleniyor…");

                  new Thread(() -> {
                      try {
                          HttpURLConnection c=(HttpURLConnection)new URL(
                              CATALOG_URL+"?v="+System.currentTimeMillis()).openConnection();
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(25000);
                          c.setRequestProperty("Cache-Control","no-cache");

                          BufferedReader br=new BufferedReader(new InputStreamReader(c.getInputStream(),"UTF-8"));
                          StringBuilder sb=new StringBuilder();
                          String line;
                          while((line=br.readLine())!=null) sb.append(line);
                          br.close();
                          c.disconnect();

                          JSONObject root=new JSONObject(sb.toString());
                          JSONArray arr=root.getJSONArray("items");
                          ArrayList<Book> temp=new ArrayList<>();

                          for(int i=0;i<arr.length();i++) {
                              JSONObject o=arr.getJSONObject(i);
                              Book x=new Book();
                              x.id=o.optString("id");
                              x.title=o.optString("title");
                              x.author=o.optString("author");
                              x.category=o.optString("category");
                              x.focus=o.optString("focus");
                              x.duration=o.optString("duration","≈12–15 dk");
                              x.source=o.optString("source","");
                              x.summary=o.optString("summary","");
                              x.adult=o.optBoolean("adult",false);
                              x.religion=o.optBoolean("religion",false);

                              JSONArray ps=o.optJSONArray("principles");
                              if(ps!=null) for(int j=0;j<ps.length();j++) x.principles.add(ps.optString(j));

                              JSONArray ac=o.optJSONArray("actions");
                              if(ac!=null) for(int j=0;j<ac.length();j++) x.actions.add(ac.optString(j));

                              temp.add(x);
                          }

                          runOnUiThread(() -> {
                              all.clear();
                              all.addAll(temp);
                              rebuildCats();
                              progress.setVisibility(View.GONE);
                              filter();
                          });

                      } catch(Exception e) {
                          runOnUiThread(() -> {
                              progress.setVisibility(View.GONE);
                              count.setText("Katalog yüklenemedi.");
                              Toast.makeText(this,"Katalog hatası: "+e.getClass().getSimpleName(),Toast.LENGTH_LONG).show();
                          });
                      }
                  }).start();
              }

              private void rebuildCats() {
                  String old=spinner.getSelectedItem()==null?"Öne Çıkanlar":spinner.getSelectedItem().toString();
                  Set<String> set=new LinkedHashSet<>();
                  set.add("Öne Çıkanlar");

                  for(Book b:all) {
                      if(b.adult&&!adultUnlocked) continue;
                      if(!b.category.isEmpty()) set.add(b.category);
                  }

                  cats.clear();
                  cats.addAll(set);
                  spinner.setAdapter(new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,cats));

                  int i=cats.indexOf(old);
                  spinner.setSelection(i<0?0:i);
              }

              private void filter() {
                  if(adapter==null) return;

                  String q=search.getText().toString().trim().toLowerCase(new Locale("tr","TR"));
                  String cat=spinner.getSelectedItem()==null?"Öne Çıkanlar":spinner.getSelectedItem().toString();

                  shown.clear();

                  for(Book b:all) {
                      if(b.adult&&!adultUnlocked) continue;
                      if(!"Öne Çıkanlar".equals(cat)&&!cat.equals(b.category)) continue;

                      String hay=(b.title+" "+b.author+" "+b.category+" "+b.focus)
                          .toLowerCase(new Locale("tr","TR"));

                      if(!q.isEmpty()&&!hay.contains(q)) continue;
                      shown.add(b);
                  }

                  count.setText(shown.size()+" içerik · toplam "+all.size());
                  adapter.notifyDataSetChanged();
              }

              private String lesson(Book x) {
                  if(x.summary!=null&&!x.summary.trim().isEmpty()) return x.summary;

                  StringBuilder s=new StringBuilder();
                  s.append("Bu dinlemenin amacı ").append(x.title)
                   .append(" konusunda sana yalnız bilgi vermek değil; ")
                   .append(x.focus==null?"bu alanı":x.focus)
                   .append(" günlük davranışa çevirmene yardım etmektir.\n\n");

                  for(int i=0;i<x.principles.size();i++) {
                      s.append(i+1).append(". temel ders: ")
                       .append(x.principles.get(i))
                       .append(" Bu fikri son bir haftadan gerçek bir örnekle ilişkilendir. ")
                       .append("Soyut bilgiyi somut davranışa çevirmek değişimi kolaylaştırır.\n\n");
                  }

                  s.append("Şimdi teoriden uygulamaya geçelim. Aynı anda her şeyi değiştirmeye çalışma.\n\n");

                  for(int i=0;i<x.actions.size();i++) {
                      s.append("Uygulama ").append(i+1).append(": ")
                       .append(x.actions.get(i))
                       .append(" Bunu küçük ve bugün uygulanabilir hale getir.\n\n");
                  }

                  s.append("Dinleme sonrası muhasebe: Bugün hangi fikri benimsedim? ")
                   .append("Hangi davranışım bununla çelişiyor? ")
                   .append("Önümüzdeki yedi gün hangi küçük davranışı tekrarlayacağım?");
                  return s.toString();
              }

              private void play(Book b) {
                  Intent i=new Intent(this,TtsPlaybackService.class);
                  i.setAction(TtsPlaybackService.ACTION_PLAY_TEXT);
                  i.putExtra(TtsPlaybackService.EXTRA_TITLE,b.title);
                  i.putExtra(TtsPlaybackService.EXTRA_TEXT,lesson(b));
                  i.putExtra(TtsPlaybackService.EXTRA_RATE,0.9f);

                  try {
                      if(Build.VERSION.SDK_INT>=26) startForegroundService(i); else startService(i);
                      Toast.makeText(this,"▶ "+b.title,Toast.LENGTH_SHORT).show();
                  } catch(Exception e) {
                      Toast.makeText(this,"Ses başlatılamadı: "+e.getClass().getSimpleName(),Toast.LENGTH_LONG).show();
                  }
              }

              private void read(Book b) {
                  TextView body=tv(lesson(b),16,Color.rgb(35,35,35));
                  body.setPadding(dp(16),dp(10),dp(16),dp(10));
                  android.widget.ScrollView sc=new android.widget.ScrollView(this);
                  sc.addView(body);

                  new AlertDialog.Builder(this)
                      .setTitle(b.title)
                      .setMessage(b.author+" · "+b.category)
                      .setView(sc)
                      .setNegativeButton("Kapat",null)
                      .setPositiveButton("▶ Dinle",(d,w)->play(b))
                      .show();
              }

              private void sendAction(String action) {
                  try {
                      Intent i=new Intent(this,TtsPlaybackService.class);
                      i.setAction(action);
                      startService(i);
                  } catch(Exception ignored) {}
              }

              private class BooksAdapter extends BaseAdapter {
                  public int getCount(){ return shown.size(); }
                  public Object getItem(int p){ return shown.get(p); }
                  public long getItemId(int p){ return p; }

                  public View getView(int p,View old,ViewGroup parent) {
                      Book b=shown.get(p);

                      LinearLayout row=new LinearLayout(MainActivity.this);
                      row.setOrientation(LinearLayout.VERTICAL);
                      row.setPadding(dp(12),dp(10),dp(12),dp(10));
                      row.setBackgroundColor(
                          b.religion?Color.rgb(25,46,31):
                          b.adult?Color.rgb(55,28,42):
                          Color.rgb(20,25,28));

                      TextView t=tv(b.title,19,Color.WHITE);
                      t.setTypeface(null,android.graphics.Typeface.BOLD);
                      row.addView(t);

                      TextView meta=tv(b.author+" · "+b.category+" · "+b.duration,13,Color.rgb(175,181,185));
                      row.addView(meta);

                      LinearLayout buttons=new LinearLayout(MainActivity.this);
                      buttons.setOrientation(LinearLayout.HORIZONTAL);

                      Button listen=new Button(MainActivity.this);
                      listen.setText("▶ DİNLE");
                      listen.setOnClickListener(v -> play(b));

                      Button read=new Button(MainActivity.this);
                      read.setText("OKU");
                      read.setOnClickListener(v -> read(b));

                      buttons.addView(listen,new LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,2f));
                      buttons.addView(read,new LinearLayout.LayoutParams(0,ViewGroup.LayoutParams.WRAP_CONTENT,1f));
                      row.addView(buttons);

                      row.setOnClickListener(v -> read(b));
                      return row;
                  }
              }

              private static class Book {
                  String id="",title="",author="",category="",focus="",duration="",source="",summary="";
                  boolean adult=false,religion=false;
                  final ArrayList<String> principles=new ArrayList<>();
                  final ArrayList<String> actions=new ArrayList<>();
              }
          }
          EOF

          cat > app/src/main/java/com/guncelgelisim/app/TtsPlaybackService.java <<'EOF'
          package com.guncelgelisim.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;

          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class TtsPlaybackService extends Service
                  implements TextToSpeech.OnInitListener {

              public static final String ACTION_PLAY_TEXT =
                      "com.guncelgelisim.PLAY_TEXT";
              public static final String ACTION_TOGGLE =
                      "com.guncelgelisim.TOGGLE";
              public static final String ACTION_STOP =
                      "com.guncelgelisim.STOP";
              public static final String ACTION_SKIP =
                      "com.guncelgelisim.SKIP";

              public static final String EXTRA_TITLE = "title";
              public static final String EXTRA_TEXT = "text";
              public static final String EXTRA_RATE = "rate";
              public static final String EXTRA_DELTA = "delta";

              private static final String CHANNEL = "gelisim_tts";
              private static final int NOTIFICATION_ID = 1515;

              private TextToSpeech tts;
              private boolean ready = false;
              private boolean paused = false;
              private boolean playing = false;
              private float rate = 0.9f;
              private String title = "15 Dakikada Gelişim";

              private final ArrayList<String> chunks = new ArrayList<>();
              private int index = 0;

              private MediaSession mediaSession;
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createChannel();

                  mediaSession = new MediaSession(this, "GelisimTTS");
                  mediaSession.setActive(true);

                  mediaSession.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { resumePlayback(); }
                      @Override public void onPause() { pausePlayback(); }
                      @Override public void onStop() { stopPlayback(); }
                      @Override public void onSkipToNext() { skip(1); }
                      @Override public void onSkipToPrevious() { skip(-1); }
                  });

                  PowerManager pm =
                          (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(
                          PowerManager.PARTIAL_WAKE_LOCK,
                          "GelisimTTS:Playback");

                  tts = new TextToSpeech(this, this);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) return START_NOT_STICKY;

                  String action = intent.getAction();

                  if (ACTION_PLAY_TEXT.equals(action)) {
                      String text = intent.getStringExtra(EXTRA_TEXT);
                      String newTitle = intent.getStringExtra(EXTRA_TITLE);
                      float newRate =
                              intent.getFloatExtra(EXTRA_RATE, rate);

                      boolean same =
                              newTitle != null &&
                              newTitle.equals(title) &&
                              !chunks.isEmpty();

                      if (same) {
                          if (paused) resumePlayback();
                          else pausePlayback();
                      } else {
                          startNew(newTitle, text, newRate);
                      }

                  } else if (ACTION_TOGGLE.equals(action)) {
                      if (paused) resumePlayback();
                      else pausePlayback();

                  } else if (ACTION_STOP.equals(action)) {
                      stopPlayback();

                  } else if (ACTION_SKIP.equals(action)) {
                      skip(intent.getIntExtra(EXTRA_DELTA, 1));
                  }

                  return START_NOT_STICKY;
              }

              private void startNew(
                      String newTitle,
                      String text,
                      float newRate) {

                  if (text == null || text.trim().isEmpty()) {
                      stopSelf();
                      return;
                  }

                  title =
                      newTitle == null || newTitle.trim().isEmpty()
                          ? "15 Dakikada Gelişim"
                          : newTitle;

                  rate = clamp(newRate);

                  chunks.clear();
                  chunks.addAll(split(text));

                  index = 0;
                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  startForeground(
                          NOTIFICATION_ID,
                          buildNotification());

                  updateMediaState();

                  if (ready) speakCurrent();
              }

              private void pausePlayback() {
                  if (chunks.isEmpty()) return;

                  paused = true;
                  playing = false;

                  if (tts != null) tts.stop();

                  updateNotification();
                  updateMediaState();
              }

              private void resumePlayback() {
                  if (chunks.isEmpty()) return;

                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  if (ready) speakCurrent();

                  updateNotification();
                  updateMediaState();
              }

              private void skip(int delta) {
                  if (chunks.isEmpty()) return;

                  if (tts != null) tts.stop();

                  index = Math.max(
                      0,
                      Math.min(
                          chunks.size() - 1,
                          index + delta));

                  paused = false;
                  playing = true;

                  ensureWakeLock();

                  if (ready) speakCurrent();

                  updateNotification();
                  updateMediaState();
              }

              private void stopPlayback() {
                  playing = false;
                  paused = false;

                  if (tts != null) tts.stop();

                  chunks.clear();
                  index = 0;

                  releaseWakeLock();

                  if (mediaSession != null) {
                      PlaybackState ps =
                          new PlaybackState.Builder()
                              .setState(
                                  PlaybackState.STATE_STOPPED,
                                  0,
                                  0f)
                              .build();
                      mediaSession.setPlaybackState(ps);
                  }

                  stopForeground(true);
                  stopSelf();
              }

              private void speakCurrent() {
                  if (!ready ||
                      !playing ||
                      paused ||
                      chunks.isEmpty()) return;

                  if (index >= chunks.size()) {
                      stopPlayback();
                      return;
                  }

                  tts.setSpeechRate(rate);

                  String utteranceId =
                          "chunk-" + index;

                  tts.speak(
                      chunks.get(index),
                      TextToSpeech.QUEUE_FLUSH,
                      null,
                      utteranceId);

                  updateNotification();
              }

              @Override
              public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS)
                      return;

                  ready = true;

                  int langResult = tts.setLanguage(
                      new Locale("tr", "TR"));

                  if (langResult == TextToSpeech.LANG_MISSING_DATA ||
                      langResult == TextToSpeech.LANG_NOT_SUPPORTED) {
                      android.widget.Toast.makeText(
                          this,
                          "Telefonda Türkçe metin okuma sesi bulunamadı. "
                              + "Ayarlar > Genel yönetim > Metin okuma bölümünü kontrol et.",
                          android.widget.Toast.LENGTH_LONG)
                          .show();
                  }

                  tts.setSpeechRate(rate);

                  tts.setAudioAttributes(
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_MEDIA)
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build());

                  tts.setOnUtteranceProgressListener(
                      new UtteranceProgressListener() {

                          @Override
                          public void onStart(
                              String utteranceId) {}

                          @Override
                          public void onDone(
                              String utteranceId) {

                              if (!playing || paused)
                                  return;

                              index++;

                              if (index >= chunks.size())
                                  stopPlayback();
                              else
                                  speakCurrent();
                          }

                          @Override
                          public void onError(
                              String utteranceId) {

                              paused = true;
                              playing = false;

                              updateNotification();
                              updateMediaState();
                          }
                      });

                  if (playing &&
                      !paused &&
                      !chunks.isEmpty()) {
                      speakCurrent();
                  }
              }

              private ArrayList<String> split(String text) {
                  ArrayList<String> out =
                      new ArrayList<>();

                  String cleaned =
                      text.replace('\u00A0', ' ')
                          .replaceAll("\\s+", " ")
                          .trim();

                  Pattern p =
                      Pattern.compile(
                          "[^.!?…]+[.!?…]+|[^.!?…]+$");

                  Matcher m =
                      p.matcher(cleaned);

                  StringBuilder b =
                      new StringBuilder();

                  while (m.find()) {
                      String sentence =
                          m.group().trim();

                      if (b.length() > 0 &&
                          b.length() +
                          sentence.length() > 700) {

                          out.add(
                              b.toString().trim());

                          b.setLength(0);
                      }

                      if (b.length() > 0)
                          b.append(' ');

                      b.append(sentence);
                  }

                  if (b.length() > 0)
                      out.add(
                          b.toString().trim());

                  if (out.isEmpty())
                      out.add(cleaned);

                  return out;
              }

              private float clamp(float v) {
                  return Math.max(
                      0.6f,
                      Math.min(1.4f, v));
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch =
                          new NotificationChannel(
                              CHANNEL,
                              "Sesli Dinleme",
                              NotificationManager.IMPORTANCE_LOW);

                      ch.setDescription(
                          "Ekran kapalıyken Türkçe TTS");

                      getSystemService(
                          NotificationManager.class)
                          .createNotificationChannel(ch);
                  }
              }

              private PendingIntent serviceIntent(
                      String action,
                      int requestCode,
                      int delta) {

                  Intent i =
                      new Intent(
                          this,
                          TtsPlaybackService.class);

                  i.setAction(action);
                  i.putExtra(
                      EXTRA_DELTA,
                      delta);

                  return PendingIntent.getService(
                      this,
                      requestCode,
                      i,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                      PendingIntent.FLAG_IMMUTABLE);
              }

              private Notification buildNotification() {
                  Intent open =
                      new Intent(
                          this,
                          MainActivity.class);

                  PendingIntent content =
                      PendingIntent.getActivity(
                          this,
                          90,
                          open,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE);

                  String progress =
                      chunks.isEmpty()
                          ? ""
                          : (Math.min(
                                  index + 1,
                                  chunks.size())
                              + " / "
                              + chunks.size());

                  Notification.Action prev =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_media_rew,
                          "Geri",
                          serviceIntent(
                              ACTION_SKIP,
                              1,
                              -1))
                          .build();

                  Notification.Action toggle =
                      new Notification.Action.Builder(
                          paused
                              ? android.R.drawable.ic_media_play
                              : android.R.drawable.ic_media_pause,
                          paused
                              ? "Devam"
                              : "Duraklat",
                          serviceIntent(
                              ACTION_TOGGLE,
                              2,
                              0))
                          .build();

                  Notification.Action next =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_media_ff,
                          "İleri",
                          serviceIntent(
                              ACTION_SKIP,
                              3,
                              1))
                          .build();

                  Notification.Action stop =
                      new Notification.Action.Builder(
                          android.R.drawable.ic_menu_close_clear_cancel,
                          "Durdur",
                          serviceIntent(
                              ACTION_STOP,
                              4,
                              0))
                          .build();

                  Notification.MediaStyle style =
                      new Notification.MediaStyle()
                          .setMediaSession(
                              mediaSession.getSessionToken())
                          .setShowActionsInCompactView(
                              0, 1, 2);

                  return new Notification.Builder(
                          this,
                          CHANNEL)
                      .setSmallIcon(
                          android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText(
                          (paused
                              ? "Duraklatıldı"
                              : "Türkçe dinleniyor")
                          + (progress.isEmpty()
                              ? ""
                              : " · " + progress))
                      .setContentIntent(content)
                      .setOnlyAlertOnce(true)
                      .setOngoing(playing && !paused)
                      .setVisibility(
                          Notification.VISIBILITY_PUBLIC)
                      .addAction(prev)
                      .addAction(toggle)
                      .addAction(next)
                      .addAction(stop)
                      .setStyle(style)
                      .build();
              }

              private void updateNotification() {
                  if (chunks.isEmpty()) return;

                  NotificationManager nm =
                      (NotificationManager)
                          getSystemService(
                              NOTIFICATION_SERVICE);

                  nm.notify(
                      NOTIFICATION_ID,
                      buildNotification());
              }

              private void updateMediaState() {
                  if (mediaSession == null) return;

                  int s =
                      paused
                          ? PlaybackState.STATE_PAUSED
                          : playing
                              ? PlaybackState.STATE_PLAYING
                              : PlaybackState.STATE_STOPPED;

                  long actions =
                      PlaybackState.ACTION_PLAY |
                      PlaybackState.ACTION_PAUSE |
                      PlaybackState.ACTION_PLAY_PAUSE |
                      PlaybackState.ACTION_SKIP_TO_NEXT |
                      PlaybackState.ACTION_SKIP_TO_PREVIOUS |
                      PlaybackState.ACTION_STOP;

                  PlaybackState ps =
                      new PlaybackState.Builder()
                          .setActions(actions)
                          .setState(
                              s,
                              index,
                              playing ? 1f : 0f)
                          .build();

                  mediaSession.setPlaybackState(ps);
              }

              private void ensureWakeLock() {
                  if (wakeLock != null &&
                      !wakeLock.isHeld()) {
                      wakeLock.acquire(
                          6 * 60 * 60 * 1000L);
                  }
              }

              private void releaseWakeLock() {
                  if (wakeLock != null &&
                      wakeLock.isHeld()) {
                      wakeLock.release();
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  if (mediaSession != null)
                      mediaSession.release();

                  releaseWakeLock();

                  super.onDestroy();
              }
          }
