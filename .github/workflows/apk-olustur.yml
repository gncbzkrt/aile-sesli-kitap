name: APK Oluştur - KitUP Kartlar + Katalog v11.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/guncelgelisim/app
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='OnBesDakikadaGelisim'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.guncelgelisim.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.guncelgelisim.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 11
                  versionName '2.2.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#101416" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F0A62A" android:pathData="M54,15a39,39 0,1 0,0 78a39,39 0,1 0,0 -78"/>
              <path android:fillColor="#101416" android:pathData="M45,35L45,73L77,54Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="15 Dakikada Gelişim"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TtsPlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/guncelgelisim/app/MainActivity.java <<'EOF'
          package com.guncelgelisim.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.net.Uri;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.GridView;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.net.URLEncoder;

          public class MainActivity extends Activity {

              private static final String CATALOG_URL =
                  "https://gncbzkrt.github.io/aile-sesli-kitap/catalog.json";
              private static final int PICK_CATALOG = 2001;
              private static final String PREFS = "gelisim_catalog";
              private static final String PREF_CUSTOM_JSON = "custom_catalog_json";

              private final ArrayList<Book> all = new ArrayList<>();
              private final ArrayList<Book> shown = new ArrayList<>();

              private GridView grid;
              private EditText search;
              private TextView count;
              private ProgressBar progress;
              private LinearLayout categoryBar;
              private BooksAdapter adapter;

              private String currentCategory = "Öne Çıkanlar";
              private boolean adultUnlocked = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS}, 10);
                  }

                  buildUi();

                  String saved = getSharedPreferences(PREFS, MODE_PRIVATE)
                      .getString(PREF_CUSTOM_JSON, "");

                  if (saved != null && !saved.trim().isEmpty()) {
                      try {
                          applyCatalogJson(saved, false);
                          Toast.makeText(
                              this,
                              "Yerel katalog kullanılıyor: " + all.size() + " içerik",
                              Toast.LENGTH_SHORT).show();
                      } catch (Exception ex) {
                          loadCatalog();
                      }
                  } else {
                      loadCatalog();
                  }
              }

              private int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + .5f);
              }

              private GradientDrawable rounded(
                      int color, int strokeColor, int radiusDp, int strokeDp) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radiusDp));
                  if (strokeDp > 0) d.setStroke(dp(strokeDp), strokeColor);
                  return d;
              }

              private TextView tv(String s, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(null, Typeface.BOLD);
                  return t;
              }

              private void styleButton(Button b, int bg, int fg) {
                  b.setAllCaps(false);
                  b.setTextColor(fg);
                  b.setTextSize(13);
                  b.setTypeface(null, Typeface.BOLD);
                  b.setBackground(rounded(bg, Color.TRANSPARENT, 14, 0));
                  b.setPadding(dp(10), dp(8), dp(10), dp(8));
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(9,12,15));
                  root.setPadding(dp(12), dp(10), dp(12), dp(8));

                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  head.setGravity(Gravity.CENTER_VERTICAL);

                  LinearLayout brandBox = new LinearLayout(this);
                  brandBox.setOrientation(LinearLayout.VERTICAL);

                  TextView brand = tv("15 DAKİKADA GELİŞİM", 19, Color.WHITE, true);
                  brandBox.addView(brand);
                  TextView sub = tv("Dinle · düşün · uygula", 11, Color.rgb(145,153,160), false);
                  brandBox.addView(sub);

                  head.addView(
                      brandBox,
                      new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button adult = new Button(this);
                  adult.setText("18+");
                  styleButton(adult, Color.rgb(32,38,44), Color.WHITE);
                  adult.setOnClickListener(v -> {
                      if (!adultUnlocked) {
                          new AlertDialog.Builder(this)
                              .setTitle("18+ Yetişkinler")
                              .setMessage("Bu bölüm yetişkinlere yönelik ilişki ve yakınlık eğitimi içerir.")
                              .setNegativeButton("Vazgeç", null)
                              .setPositiveButton("18 yaş ve üzerindeyim", (d,w) -> {
                                  adultUnlocked = true;
                                  adult.setText("18+ ✓");
                                  styleButton(adult, Color.rgb(111,47,76), Color.WHITE);
                                  rebuildCategories();
                                  filter();
                              }).show();
                      } else {
                          adultUnlocked = false;
                          adult.setText("18+");
                          styleButton(adult, Color.rgb(32,38,44), Color.WHITE);
                          if ("18+ Yetişkin".equals(currentCategory))
                              currentCategory = "Öne Çıkanlar";
                          rebuildCategories();
                          filter();
                      }
                  });

                  head.addView(adult);
                  root.addView(head);

                  LinearLayout catalogBox = new LinearLayout(this);
                  catalogBox.setOrientation(LinearLayout.VERTICAL);
                  catalogBox.setPadding(dp(8), dp(8), dp(8), dp(8));
                  catalogBox.setBackground(
                      rounded(Color.rgb(14,18,23), Color.rgb(34,42,49), 18, 1));

                  TextView catalogTitle = tv(
                      "Katalog Yönetimi", 12, Color.rgb(173,181,186), true);
                  catalogBox.addView(catalogTitle);

                  LinearLayout catalogActions = new LinearLayout(this);
                  catalogActions.setOrientation(LinearLayout.HORIZONTAL);

                  Button request = new Button(this);
                  request.setText("+ İçerik");
                  styleButton(request, Color.rgb(240,166,42), Color.rgb(18,18,18));
                  request.setOnClickListener(v -> showContentRequest());

                  Button importBtn = new Button(this);
                  importBtn.setText("Dosya Yükle");
                  styleButton(importBtn, Color.rgb(31,38,44), Color.WHITE);
                  importBtn.setOnClickListener(v -> pickCatalogFile());

                  Button updateBtn = new Button(this);
                  updateBtn.setText("↻ Güncelle");
                  styleButton(updateBtn, Color.rgb(31,38,44), Color.WHITE);
                  updateBtn.setOnClickListener(v -> {
                      getSharedPreferences(PREFS, MODE_PRIVATE)
                          .edit().remove(PREF_CUSTOM_JSON).apply();
                      loadCatalog();
                  });

                  catalogActions.addView(
                      request,
                      new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  View cg1 = new View(this);
                  catalogActions.addView(cg1, new LinearLayout.LayoutParams(dp(6), 1));

                  catalogActions.addView(
                      importBtn,
                      new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  View cg2 = new View(this);
                  catalogActions.addView(cg2, new LinearLayout.LayoutParams(dp(6), 1));

                  catalogActions.addView(
                      updateBtn,
                      new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  LinearLayout.LayoutParams caLp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT);
                  caLp.setMargins(0, dp(7), 0, 0);
                  catalogBox.addView(catalogActions, caLp);

                  LinearLayout.LayoutParams cbLp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT);
                  cbLp.setMargins(0, dp(10), 0, 0);
                  root.addView(catalogBox, cbLp);

                  search = new EditText(this);
                  search.setHint("Konu, kitap, yazar veya beceri ara…");
                  search.setHintTextColor(Color.rgb(112,121,128));
                  search.setTextColor(Color.WHITE);
                  search.setSingleLine(true);
                  search.setBackground(
                      rounded(Color.rgb(18,23,27), Color.rgb(37,44,50), 20, 1));
                  search.setPadding(dp(14), dp(11), dp(14), dp(11));

                  LinearLayout.LayoutParams searchLp =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  searchLp.setMargins(0, dp(12), 0, dp(8));
                  root.addView(search, searchLp);

                  HorizontalScrollView hsv = new HorizontalScrollView(this);
                  hsv.setHorizontalScrollBarEnabled(false);
                  categoryBar = new LinearLayout(this);
                  categoryBar.setOrientation(LinearLayout.HORIZONTAL);
                  hsv.addView(categoryBar);
                  root.addView(hsv);

                  LinearLayout info = new LinearLayout(this);
                  info.setOrientation(LinearLayout.HORIZONTAL);
                  info.setGravity(Gravity.CENTER_VERTICAL);

                  count = tv("Katalog yükleniyor…", 13, Color.rgb(185,191,196), true);
                  info.addView(
                      count,
                      new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button refresh = new Button(this);
                  refresh.setText("↻");
                  styleButton(refresh, Color.rgb(31,37,43), Color.WHITE);
                  refresh.setOnClickListener(v -> {
                      getSharedPreferences(PREFS, MODE_PRIVATE)
                          .edit().remove(PREF_CUSTOM_JSON).apply();
                      loadCatalog();
                  });
                  info.addView(refresh);

                  LinearLayout.LayoutParams infoLp =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  infoLp.setMargins(0, dp(8), 0, dp(7));
                  root.addView(info, infoLp);

                  progress = new ProgressBar(this);
                  root.addView(progress);

                  grid = new GridView(this);
                  grid.setNumColumns(2);
                  grid.setColumnWidth(dp(150));
                  grid.setHorizontalSpacing(dp(10));
                  grid.setVerticalSpacing(dp(10));
                  grid.setStretchMode(GridView.STRETCH_COLUMN_WIDTH);
                  grid.setVerticalScrollBarEnabled(false);
                  grid.setSelector(android.R.color.transparent);
                  grid.setBackgroundColor(Color.TRANSPARENT);

                  adapter = new BooksAdapter();
                  grid.setAdapter(adapter);

                  root.addView(
                      grid,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  LinearLayout player = new LinearLayout(this);
                  player.setOrientation(LinearLayout.HORIZONTAL);
                  player.setPadding(dp(7), dp(7), dp(7), dp(7));
                  player.setBackground(
                      rounded(Color.rgb(17,22,27), Color.rgb(38,45,51), 20, 1));

                  Button pause = new Button(this);
                  pause.setText("⏯  Duraklat / Devam");
                  styleButton(pause, Color.rgb(40,47,54), Color.WHITE);
                  pause.setOnClickListener(v ->
                      sendAction(TtsPlaybackService.ACTION_TOGGLE));

                  Button stop = new Button(this);
                  stop.setText("■");
                  styleButton(stop, Color.rgb(82,43,49), Color.WHITE);
                  stop.setOnClickListener(v ->
                      sendAction(TtsPlaybackService.ACTION_STOP));

                  player.addView(
                      pause,
                      new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 3f));

                  View pgap = new View(this);
                  player.addView(pgap, new LinearLayout.LayoutParams(dp(7), 1));

                  player.addView(
                      stop,
                      new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  LinearLayout.LayoutParams playerLp =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  playerLp.setMargins(0, dp(7), 0, 0);
                  root.addView(player, playerLp);

                  setContentView(root);

                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s,int st,int c,int a){}
                      public void onTextChanged(CharSequence s,int st,int b,int c){
                          filter();
                      }
                      public void afterTextChanged(Editable e){}
                  });
              }

              private void rebuildCategories() {
                  Set<String> set = new LinkedHashSet<>();
                  set.add("Öne Çıkanlar");

                  for (Book b : all) {
                      if (b.adult && !adultUnlocked) continue;
                      if (!b.category.isEmpty()) set.add(b.category);
                  }

                  categoryBar.removeAllViews();

                  for (String cat : set) {
                      Button chip = new Button(this);
                      chip.setText(cat);
                      chip.setAllCaps(false);
                      chip.setTextSize(13);
                      chip.setTypeface(null, Typeface.BOLD);

                      boolean active = cat.equals(currentCategory);
                      int bg = active ? Color.rgb(240,166,42) : Color.rgb(25,31,36);
                      int fg = active ? Color.rgb(20,20,20) : Color.rgb(198,203,207);

                      chip.setTextColor(fg);
                      chip.setBackground(
                          rounded(bg, Color.rgb(43,50,56), 999, active ? 0 : 1));
                      chip.setPadding(dp(13), dp(7), dp(13), dp(7));

                      LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, 0, dp(7), 0);

                      chip.setOnClickListener(v -> {
                          if ("18+ Yetişkin".equals(cat) && !adultUnlocked)
                              return;
                          currentCategory = cat;
                          rebuildCategories();
                          filter();
                      });

                      categoryBar.addView(chip, lp);
                  }
              }

              private void loadCatalog() {
                  progress.setVisibility(View.VISIBLE);
                  count.setText("Katalog yükleniyor…");

                  new Thread(() -> {
                      try {
                          HttpURLConnection c =
                              (HttpURLConnection)new URL(
                                  CATALOG_URL + "?v=" + System.currentTimeMillis())
                                  .openConnection();

                          c.setConnectTimeout(15000);
                          c.setReadTimeout(25000);
                          c.setRequestProperty("Cache-Control","no-cache");

                          BufferedReader br =
                              new BufferedReader(
                                  new InputStreamReader(
                                      c.getInputStream(),"UTF-8"));

                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line=br.readLine())!=null) sb.append(line);

                          br.close();
                          c.disconnect();

                          String raw = sb.toString();

                          runOnUiThread(() -> {
                              try {
                                  applyCatalogJson(raw, false);
                                  progress.setVisibility(View.GONE);
                                  Toast.makeText(
                                      this,
                                      "Katalog güncellendi: " + all.size() + " içerik",
                                      Toast.LENGTH_SHORT).show();
                              } catch (Exception ex) {
                                  progress.setVisibility(View.GONE);
                                  count.setText("Katalog geçersiz.");
                                  Toast.makeText(
                                      this,
                                      "Katalog biçimi geçersiz.",
                                      Toast.LENGTH_LONG).show();
                              }
                          });

                      } catch(Exception e) {
                          runOnUiThread(() -> {
                              progress.setVisibility(View.GONE);
                              count.setText("Katalog yüklenemedi.");
                              Toast.makeText(
                                  this,
                                  "Katalog hatası: "+e.getClass().getSimpleName(),
                                  Toast.LENGTH_LONG).show();
                          });
                      }
                  }).start();
              }

              private void applyCatalogJson(String raw, boolean saveLocal) throws Exception {
                  JSONObject root = new JSONObject(raw);
                  JSONArray arr = root.getJSONArray("items");
                  ArrayList<Book> temp = new ArrayList<>();

                  for (int i=0;i<arr.length();i++) {
                      JSONObject o = arr.getJSONObject(i);
                      Book x = new Book();

                      x.id=o.optString("id");
                      x.title=o.optString("title");
                      x.author=o.optString("author");
                      x.category=o.optString("category");
                      x.focus=o.optString("focus");
                      x.duration=o.optString("duration","≈12–15 dk");
                      x.source=o.optString("source","");
                      x.summary=o.optString("summary","");
                      x.adult=o.optBoolean("adult",false);
                      x.religion=o.optBoolean("religion",false);

                      JSONArray ps=o.optJSONArray("principles");
                      if(ps!=null)
                          for(int j=0;j<ps.length();j++)
                              x.principles.add(ps.optString(j));

                      JSONArray ac=o.optJSONArray("actions");
                      if(ac!=null)
                          for(int j=0;j<ac.length();j++)
                              x.actions.add(ac.optString(j));

                      temp.add(x);
                  }

                  if (temp.isEmpty())
                      throw new IllegalArgumentException("Boş katalog");

                  all.clear();
                  all.addAll(temp);

                  if (saveLocal) {
                      getSharedPreferences(PREFS, MODE_PRIVATE)
                          .edit().putString(PREF_CUSTOM_JSON, raw).apply();
                  }

                  rebuildCategories();
                  progress.setVisibility(View.GONE);
                  filter();
              }

              private void pickCatalogFile() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("application/json");
                  startActivityForResult(i, PICK_CATALOG);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode != PICK_CATALOG ||
                      resultCode != RESULT_OK ||
                      data == null ||
                      data.getData() == null) return;

                  try {
                      Uri uri = data.getData();
                      InputStream in = getContentResolver().openInputStream(uri);
                      BufferedReader br = new BufferedReader(
                          new InputStreamReader(in, "UTF-8"));

                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line);
                      br.close();

                      applyCatalogJson(sb.toString(), true);

                      Toast.makeText(
                          this,
                          "Yeni katalog yüklendi: " + all.size() + " içerik",
                          Toast.LENGTH_LONG).show();

                  } catch (Exception ex) {
                      Toast.makeText(
                          this,
                          "Katalog dosyası geçerli değil.",
                          Toast.LENGTH_LONG).show();
                  }
              }

              private String buildRequestPrompt(int target, String note) {
                  return "15 Dakikada Gelişim uygulamamın catalog.json kataloğunu genişlet. " +
                      "Mevcut içerik sayısı " + all.size() + ", hedef toplam " + target + ". " +
                      "Tüm görünür ve dinlenen içerik Türkçe olacak. " +
                      "İçerikler kitap tanıtımı değil, kişisel gelişime katkı sağlayan uygulanabilir dersler olacak. " +
                      "Mevcut id ve başlıkları tekrar etme. Din & Hayat ve 18+ Yetişkin kategorilerini koru. " +
                      "Uygulama koduna dokunma; yalnız güncellenmiş catalog.json dosyasını üret." +
                      (note == null || note.trim().isEmpty() ? "" : " Ek isteğim: " + note.trim());
              }

              private void showContentRequest() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(18), dp(8), dp(18), 0);

                  EditText target = new EditText(this);
                  target.setHint("Hedef toplam içerik");
                  target.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
                  target.setText(String.valueOf(Math.max(1500, all.size()+500)));
                  box.addView(target);

                  EditText note = new EditText(this);
                  note.setHint("Ek istek: örn. Din & Hayat 200 olsun…");
                  note.setMinLines(2);
                  box.addView(note);

                  AlertDialog dialog = new AlertDialog.Builder(this)
                      .setTitle("Yeni İçerik Talep Et")
                      .setMessage("Hedef sayıyı yaz. Hazır talebi kopyalayabilir veya paylaşabilirsin.")
                      .setView(box)
                      .setNegativeButton("Kapat", null)
                      .setNeutralButton("Kopyala", null)
                      .setPositiveButton("Paylaş", null)
                      .create();

                  dialog.setOnShowListener(x -> {
                      dialog.getButton(AlertDialog.BUTTON_NEUTRAL)
                          .setOnClickListener(v -> {
                              int t;
                              try { t = Integer.parseInt(target.getText().toString().trim()); }
                              catch (Exception e) { t = Math.max(1500, all.size()+500); }

                              String prompt = buildRequestPrompt(t, note.getText().toString());
                              ClipboardManager cm = (ClipboardManager)
                                  getSystemService(Context.CLIPBOARD_SERVICE);
                              cm.setPrimaryClip(ClipData.newPlainText("İçerik talebi", prompt));
                              Toast.makeText(this, "Talep kopyalandı.", Toast.LENGTH_SHORT).show();
                          });

                      dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                          .setOnClickListener(v -> {
                              int t;
                              try { t = Integer.parseInt(target.getText().toString().trim()); }
                              catch (Exception e) { t = Math.max(1500, all.size()+500); }

                              String prompt = buildRequestPrompt(t, note.getText().toString());
                              Intent share = new Intent(Intent.ACTION_SEND);
                              share.setType("text/plain");
                              share.putExtra(Intent.EXTRA_TEXT, prompt);
                              startActivity(Intent.createChooser(share, "İçerik talebini paylaş"));
                          });
                  });

                  dialog.show();
              }

              private void filter() {
                  if (adapter == null) return;

                  String q = search.getText().toString()
                      .trim().toLowerCase(new Locale("tr","TR"));

                  shown.clear();

                  for (Book b : all) {
                      if (b.adult && !adultUnlocked) continue;

                      boolean categoryOk =
                          "Öne Çıkanlar".equals(currentCategory) ||
                          currentCategory.equals(b.category);

                      if (!categoryOk) continue;

                      String hay =
                          (b.title+" "+b.author+" "+b.category+" "+b.focus)
                              .toLowerCase(new Locale("tr","TR"));

                      if (!q.isEmpty() && !hay.contains(q)) continue;

                      shown.add(b);
                  }

                  count.setText(shown.size()+" içerik");
                  adapter.notifyDataSetChanged();
              }

              private String lesson(Book x) {
                  if (x.summary!=null && !x.summary.trim().isEmpty())
                      return x.summary;

                  StringBuilder s = new StringBuilder();

                  s.append("Bu dinlemenin amacı ")
                   .append(x.title)
                   .append(" konusunda sana yalnız bilgi vermek değil; ")
                   .append(x.focus==null?"bu alanı":x.focus)
                   .append(" günlük davranışa çevirmene yardım etmektir.\n\n");

                  for (int i=0;i<x.principles.size();i++) {
                      s.append(i+1).append(". temel ders: ")
                       .append(x.principles.get(i))
                       .append(" Bu fikri son bir haftadan gerçek bir örnekle ilişkilendir. ")
                       .append("Soyut bilgiyi somut davranışa çevirmek değişimi kolaylaştırır.\n\n");
                  }

                  s.append("Şimdi teoriden uygulamaya geçelim. ")
                   .append("Aynı anda her şeyi değiştirmeye çalışma.\n\n");

                  for (int i=0;i<x.actions.size();i++) {
                      s.append("Uygulama ")
                       .append(i+1)
                       .append(": ")
                       .append(x.actions.get(i))
                       .append(" Bunu küçük ve bugün uygulanabilir hale getir.\n\n");
                  }

                  s.append("Dinleme sonrası muhasebe: ")
                   .append("Bugün hangi fikri benimsedim? ")
                   .append("Hangi davranışım bununla çelişiyor? ")
                   .append("Önümüzdeki yedi gün hangi küçük davranışı tekrarlayacağım?");

                  return s.toString();
              }

              private void play(Book b) {
                  Intent i = new Intent(this,TtsPlaybackService.class);
                  i.setAction(TtsPlaybackService.ACTION_PLAY_TEXT);
                  i.putExtra(TtsPlaybackService.EXTRA_TITLE,b.title);
                  i.putExtra(TtsPlaybackService.EXTRA_TEXT,lesson(b));
                  i.putExtra(TtsPlaybackService.EXTRA_RATE,0.9f);

                  try {
                      if(Build.VERSION.SDK_INT>=26)
                          startForegroundService(i);
                      else
                          startService(i);

                      Toast.makeText(
                          this,
                          "▶ "+b.title,
